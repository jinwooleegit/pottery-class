<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단편 소설 모음</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #27ae60;
            --text-color: #333;
            --background-color: #f5f6fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            background: var(--primary-color);
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .description {
            color: #bdc3c7;
            max-width: 600px;
            margin: 0 auto;
        }

        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .story-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .story-card:hover {
            transform: translateY(-5px);
        }

        .story-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .story-info {
            padding: 20px;
        }

        .story-title {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .story-author {
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .story-excerpt {
            color: #666;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .read-more {
            display: inline-block;
            padding: 8px 16px;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .read-more:hover {
            background: #219a52;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--primary-color);
            color: white;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .story-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>단편 소설 모음</h1>
            <p class="description">시간을 초월한 감동과 깊이 있는 통찰을 선사하는 세계 문학 단편선</p>
        </div>
    </header>

    <main class="container">
        <div class="story-grid">
            <article class="story-card">
                <img src="https://placehold.co/600x400/e9ecef/495057?text=The+Last+Leaf" alt="마지막 잎새">
                <div class="story-info">
                    <h2 class="story-title">마지막 잎새</h2>
                    <p class="story-author">O. 헨리</p>
                    <p class="story-excerpt">한 화가의 마지막 걸작이 젊은 예술가의 생명을 구하는 감동적인 이야기. 예술과 희생, 그리고 인간애에 대한 아름다운 단편.</p>
                    <div class="reading-options">
                        <a href="stories/the-last-leaf/original.html" class="read-more">원작으로 읽기</a>
                        <a href="stories/the-last-leaf/" class="read-more interactive">인터랙티브로 읽기</a>
                    </div>
                </div>
            </article>
            <!-- 새로운 소설이 추가될 때마다 여기에 article 추가 -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 단편 소설 모음. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
