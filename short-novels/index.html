                    <p class="author">O. Henry</p>
                </div>
                <div class="story-card-body">
                    <p class="description">그리니치 빌리지의 작은 아파트에서 두 젊은 여성 예술가인 수와 존시가 함께 살고 있습니다. 존시가 폐렴에 걸려 병석에 누웠을 때, 그녀는 창문 밖 담쟁이덩굴에서 마지막 잎새가 떨어지면 자신도 죽을 것이라고 확신합니다. 그들의 이웃인 노화가 베르만은 그녀를 구하기 위해 자신의 걸작을 만들어냅니다.</p>
                </div>
