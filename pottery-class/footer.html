<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .footer {
            background-color: #333;
            color: #fff;
            padding: 2rem 0;
            text-align: center;
            position: relative;
            bottom: 0;
            width: 100%;
            margin-top: 2rem;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .footer p {
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }

        .footer a {
            color: #fff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <footer class="footer">
        <div class="footer-content">
            <p>© 2024 도예 수업. All rights reserved.</p>
            <p>문의: <a href="mailto:contact@example.com">contact@example.com</a></p>
            <p>이 사이트는 도예 수업 내용을 정리한 것입니다.</p>
        </div>
    </footer>
</body>
</html>
